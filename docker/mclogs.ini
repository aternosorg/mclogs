post_max_size = 50M

; Never let PHP parse request bodies itself (mitigates multipart parser vulnerability).
; Bodies are read from php://input in src/Api/ContentParser.php.
enable_post_data_reading = Off
session.upload_progress.enabled = Off

error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr